  <script>
    function flashCopied() {
      var btn = document.querySelector('button[onclick="copyPage()"]');
      if (btn) { var t = btn.textContent; btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = t; }, 1500); }
    }

    // Fallback для file:// и старых браузеров, где нет navigator.clipboard.
    function legacyCopy(el) {
      const selection = window.getSelection();
      selection.removeAllRanges();
      const range = document.createRange();
      range.selectNode(el);
      selection.addRange(range);
      try {
        if (document.execCommand('copy')) flashCopied();
      } finally {
        selection.removeAllRanges();
      }
    }

    async function copyPage() {
      const el = document.getElementById('signature');
      if (!el) return;
      const html = el.outerHTML;
      // Современный путь: кладём и text/html, и text/plain — так HTML-подпись вставляется в почтовый клиент.
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([el.innerText], { type: 'text/plain' })
            })
          ]);
          flashCopied();
          return;
        } catch (e) {
          console.log('Clipboard API failed, falling back:', e);
        }
      }
      legacyCopy(el);
    }
    async function textToImage(text, styles, options) {
      options = options || {};

      // Надёжное ожидание шрифта: ждём готовности всех шрифтов и явно проверяем нужный.
      // Без магических setTimeout — это и была причина «неправильного шрифта» в Safari.
      const fontSpec = `${styles.fontWeight || '700'} ${styles.fontSize || '26px'} "QB One Bold"`;
      if (document.fonts) {
        try {
          if (document.fonts.load) await document.fonts.load(fontSpec, text);
          if (document.fonts.ready) await document.fonts.ready;
          // Safari иногда рапортует ready до готовности глифов — короткий добор с проверкой check().
          for (let i = 0; i < 20 && document.fonts.check && !document.fonts.check(fontSpec); i++) {
            await new Promise(r => requestAnimationFrame(r));
          }
        } catch (e) {
          console.log('Font loading error:', e);
        }
      }

      // Логические (CSS) единицы. Рисуем в dpr раз больше — резко на Retina/Safari.
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const PAD_X = 4;   // горизонтальный запас, чтобы Safari не резал выносные части глифов
      const PAD_Y = 4;   // вертикальный запас сверху/снизу

      const measureCanvas = document.createElement('canvas');
      const mctx = measureCanvas.getContext('2d');
      const fontFamily = styles.fontFamily || "'QB One Bold', Manrope, Arial, sans-serif";
      const fontStr = `${styles.fontWeight || '700'} ${styles.fontSize || '26px'} ${fontFamily}`;
      mctx.font = fontStr;
      mctx.textBaseline = 'top';

      const fontSizePx = parseInt(styles.fontSize, 10) || 26;

      // Высота строки из line-height (число / % / px), не меньше размера шрифта.
      let lineHeightPx = fontSizePx * 1.2;
      const lh = styles.lineHeight;
      if (lh) {
        if (typeof lh === 'number' && lh > 0) {
          lineHeightPx = fontSizePx * lh;
        } else if (typeof lh === 'string') {
          const trimmed = lh.trim();
          if (trimmed.endsWith('%')) lineHeightPx = fontSizePx * (parseFloat(trimmed) / 100);
          else if (trimmed.endsWith('px')) lineHeightPx = parseFloat(trimmed) || fontSizePx * 1.2;
          else { const n = parseFloat(trimmed); if (!isNaN(n) && n > 0) lineHeightPx = fontSizePx * n; }
        }
      }
      const effectiveLineHeight = Math.max(fontSizePx * 1.2, lineHeightPx);

      // Всегда одна строка — без переноса, независимо от длины имени.
      const lines = [text];
      const contentWidth = mctx.measureText(text).width;

      // Логические размеры холста с паддингом.
      const logicalWidth = Math.ceil(contentWidth) + PAD_X * 2;
      const defaultHeight = Math.ceil(lines.length * effectiveLineHeight) + PAD_Y * 2;
      const logicalHeight = (options.overrideHeight > 0) ? options.overrideHeight : defaultHeight;

      // Физический холст = логика * dpr.
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(logicalWidth * dpr);
      canvas.height = Math.round(logicalHeight * dpr);
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);                 // дальше рисуем в логических координатах
      ctx.font = fontStr;                  // ставим ПОСЛЕ resize/scale — иначе стейт сбрасывается
      ctx.fillStyle = styles.color || '#16103E';
      ctx.textBaseline = 'top';

      lines.forEach((line, index) => {
        ctx.fillText(line, PAD_X, PAD_Y + index * effectiveLineHeight);
      });

      return {
        dataUrl: canvas.toDataURL('image/png'),
        width: logicalWidth,
        height: logicalHeight,
        heightUsed: logicalHeight
      };
    }

    // Показать/скрыть фото. Схлопываем саму <td> (display:none + сброс width/padding),
    // иначе пустая ячейка держит ~33% ширины и текст уезжает.
    function togglePhoto() {
      const cb = document.getElementById('in-photo');
      const cell = document.getElementById('avatar-cell');
      if (!cell) return;
      if (cb.checked) {
        cell.style.display = '';
        cell.setAttribute('width', '33.33%');
        cell.style.paddingRight = '20px';
      } else {
        cell.style.display = 'none';
        cell.setAttribute('width', '0');
        cell.style.paddingRight = '0';
      }
    }

    // Функция для обновления текста имени в реальном времени
    function updateNameText() {
      const nameElement = document.getElementById('name');
      const nameText = document.getElementById('in-name').value;
      
      // Если элемент - контейнер с картинкой, сначала вернем его к тексту
      if (nameElement.tagName === 'SPAN') {
        const strong = document.createElement('strong');
        strong.id = 'name';
        strong.style.cssText = 'font-size: 26px; color: #16103E; font-weight: 700; line-height: 120%; font-family: \'QB One Bold\', Manrope, Arial, sans-serif; vertical-align: top; display: inline; max-width: 300px;';
        strong.textContent = nameText;
        nameElement.parentNode.replaceChild(strong, nameElement);
      } else {
        nameElement.textContent = nameText;
      }
    }

    async function updateImage() {
      const filename = document.getElementById('in-filename').value;
      document.getElementById('result').src = 'https://cdn.slotegrator.pro/signature/' + filename + ".png";

      let nameElement = document.getElementById('name');
      const nameText = document.getElementById('in-name').value;
      
      // Проверяем, есть ли уже контейнер с изображением
      let imgElement = null;
      let fallbackElement = null;
      let container = null;
      
      if (nameElement.tagName === 'SPAN' && nameElement.querySelector('img')) {
        // Уже есть контейнер
        container = nameElement;
        imgElement = container.querySelector('img');
        fallbackElement = container.querySelector('span[aria-hidden="true"]');
      } else if (nameElement.tagName === 'IMG') {
        // Только изображение, нужно создать контейнер
        container = document.createElement('span');
        container.style.position = 'relative';
        container.style.display = 'inline-block';
        container.style.verticalAlign = 'top';
        imgElement = nameElement;
        nameElement.parentNode.replaceChild(container, nameElement);
        container.appendChild(imgElement);
      }
      
      if (imgElement && container) {
        // Обновляем существующее изображение
        const styles = {
          fontSize: '26px',
          fontWeight: '700',
          fontFamily: "'QB One Bold', Manrope, Arial, sans-serif",
          color: '#16103E',
          lineHeight: '1.2'
        };
        
        const overrideHeightRaw = document.getElementById('in-canvas-height').value.trim();
        const overrideHeight = overrideHeightRaw === '' ? null : parseInt(overrideHeightRaw, 10);
        const options = (overrideHeight > 0) ? { overrideHeight } : {};
        const result = await textToImage(nameText, styles, options);
        document.getElementById('in-canvas-height').value = result.heightUsed;
        imgElement.src = result.dataUrl;
        imgElement.alt = nameText;
        imgElement.id = 'name';
        // Пиним логический размер, чтобы dpr-холст не отрисовался вдвое крупнее.
        imgElement.setAttribute('width', result.width);
        imgElement.setAttribute('height', result.height);
        imgElement.style.width = result.width + 'px';
        imgElement.style.height = result.height + 'px';
        
        // Обновляем fallback текст
        if (fallbackElement) {
          fallbackElement.textContent = nameText;
        } else {
          // Создаем fallback, если его нет
          fallbackElement = document.createElement('span');
          fallbackElement.textContent = nameText;
          fallbackElement.style.cssText = nameElement.style.cssText;
          fallbackElement.style.position = 'absolute';
          fallbackElement.style.left = '-9999px';
          fallbackElement.style.visibility = 'hidden';
          fallbackElement.setAttribute('aria-hidden', 'true');
          container.insertBefore(fallbackElement, imgElement);
        }
        
        imgElement.onerror = function() {
          imgElement.style.display = 'none';
          fallbackElement.style.position = 'static';
          fallbackElement.style.visibility = 'visible';
          fallbackElement.style.left = 'auto';
        };
      } else {
        // Получаем стили элемента
        const computedStyle = window.getComputedStyle(nameElement);
        const styles = {
          fontSize: computedStyle.fontSize,
          fontWeight: computedStyle.fontWeight,
          fontFamily: computedStyle.fontFamily,
          color: computedStyle.color,
          lineHeight: computedStyle.lineHeight
        };
        
        // Преобразуем текст в изображение
        const overrideHeightRaw = document.getElementById('in-canvas-height').value.trim();
        const overrideHeight = overrideHeightRaw === '' ? null : parseInt(overrideHeightRaw, 10);
        const options = (overrideHeight > 0) ? { overrideHeight } : {};
        const result = await textToImage(nameText, styles, options);
        document.getElementById('in-canvas-height').value = result.heightUsed;
        
        // Для email: создаем структуру где текст всегда в HTML как fallback
        // Текст будет виден, если изображение не загрузится
        
        // Создаем img элемент
        const img = document.createElement('img');
        img.id = 'name';
        img.src = result.dataUrl;
        img.alt = nameText; // Alt текст как fallback для email
        img.style.cssText = nameElement.style.cssText;
        img.style.display = 'inline-block';
        img.style.verticalAlign = 'top';
        img.style.marginRight = '6px';
        // Пиним логический размер (dpr-холст иначе будет вдвое крупнее).
        img.setAttribute('width', result.width);
        img.setAttribute('height', result.height);
        img.style.width = result.width + 'px';
        img.style.height = result.height + 'px';
        
        // Создаем текст как дополнительный fallback (всегда в HTML)
        // В email клиентах, если изображение не загрузится, alt текст будет виден
        // Но для надежности добавляем и текстовый fallback
        const fallbackText = document.createElement('span');
        fallbackText.textContent = nameText;
        fallbackText.style.cssText = nameElement.style.cssText;
        fallbackText.style.verticalAlign = 'top';
        fallbackText.style.display = 'inline-block';
        fallbackText.style.marginRight = '6px';
        // Скрываем текст, когда изображение загружено (через CSS)
        // Но если изображение не загрузится, текст будет виден
        fallbackText.style.fontSize = '0';
        fallbackText.style.lineHeight = '0';
        fallbackText.style.width = '1px';
        fallbackText.style.height = '1px';
        fallbackText.style.overflow = 'hidden';
        fallbackText.style.opacity = '0';
        
        // Создаем контейнер
        const container = document.createElement('span');
        container.style.display = 'inline-block';
        container.style.verticalAlign = 'top';
        container.style.position = 'relative';
        
        // Добавляем элементы (сначала изображение, потом текст)
        container.appendChild(img);
        container.appendChild(fallbackText);
        
        // Заменяем элемент
        nameElement.parentNode.replaceChild(container, nameElement);
      }
      
      document.getElementById('position').textContent = document.getElementById('in-position').value;
      document.getElementById('phone').textContent = "+" + document.getElementById('in-phone').value;
      const raw = document.getElementById('in-phone').value;
      const cleaned = raw.replace(/[\s\(\)\-]/g, '');
      document.getElementById('phone').href = "tel:+" + cleaned;
      document.getElementById('whatsapp').href = "https://api.whatsapp.com/send?phone=" + cleaned;
      document.getElementById('booking').href = document.getElementById('in-booking').value;
      document.getElementById('telegram').href = "https://t.me/" + document.getElementById('in-telegram').value;
      document.getElementById('linkedin').href = document.getElementById('in-linkedin').value;
    }

    // Инициализация при загрузке: имя захардкожено, сразу генерируем картинку и вставляем
    document.addEventListener('DOMContentLoaded', function() {
      togglePhoto();
      updateImage();
    });
  </script>
